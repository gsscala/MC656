name: CI Pipeline

on:
  pull_request:
    branches: [ main, develop ]
  push:
    branches: [ main, develop ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: backend install, lint, build, test
        working-directory: ./backend
        run: |
          npm ci
          npm run lint
          npm run build
          npm run test
          npm run test:bdd

      - name: frontend install, lint, build, test
        working-directory: ./frontend
        run: |
          npm ci
          npm run lint
          npm run build
          npm run test